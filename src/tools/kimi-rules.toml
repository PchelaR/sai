[[permission.rules]]
decision = "deny"
pattern = "Bash(rm *)"
reason = "Deleting files is not allowed"

[[permission.rules]]
decision = "deny"
pattern = "Bash(rmdir *)"
reason = "Deleting files is not allowed"

