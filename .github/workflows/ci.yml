name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The scripts sai runs on the VPS, run for real: services in Docker, snapshots, the
  # report of each answer. shellcheck catches what bash -n cannot. All tests run here once
  # more, with coverage: the summary is on the run's page, the full report in its artifacts
  vps-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck --shell=bash --severity=error
      - name: Pull the images the tests use
        run: |
          docker pull -q debian:trixie-slim
          docker pull -q mariadb:10.11
          docker pull -q redis:7
          docker pull -q rabbitmq:3.13-management
      - name: Tests with the scripts against Docker
        env:
          SAI_DOCKER_TESTS: "1"
        run: cargo llvm-cov --locked --no-report -- --test-threads=2
      - name: Coverage
        run: |
          cargo llvm-cov report --html
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: target/llvm-cov/html

  # The setup of a VPS, run on the runner itself with the scripts `sai setup` sends: it
  # changes sshd, the firewall and users there, fine on a machine thrown away after the job
  vps-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the tests first, the firewall comes up during them
        run: cargo test --locked --no-run
      - name: sshd, as every VPS has
        run: sudo apt-get install -y -q openssh-server
      - name: Setup of a VPS
        env:
          SAI_VPS_TESTS: "1"
        run: cargo test --locked setup::script_tests
